<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div class="grilla-layout">

        <header class="cabecera">
            <button id="btn-menu" class="btn-menu" aria-label="Abrir menú">☰</button>
            <h2>Panel de Control</h2>
        </header>

        <nav class="navegacion" id="menu-lateral">
            <ul>
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Estadísticas</a></li>
                <li><a href="#">Configuración</a></li>
                <li><a href="login.html">Cerrar Sesión</a></li>
            </ul>
        </nav>

        <main class="contenido-principal">
            <h3>Bienvenido al Dashboard</h3>
            <p>Selecciona una opción del menú para comenzar a trabajar.</p>
        </main>

        <footer class="pie-pagina">
            <p>Información de mi empresa - 2026</p>
        </footer>

    </div>

    <script>
        const btnMenu = document.getElementById("btn-menu");
        const menuLateral = document.getElementById("menu-lateral");

        btnMenu.addEventListener("click", function () {
            menuLateral.classList.toggle("desplegado");
        });
    </script>
</body>
</html>
