<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <main class="login-wrapper">
        <form action="dashboard.html" class="login-form">
            <h2>Acceso al Sistema</h2>

            <div class="grupo-input">
                <label for="usuario">Nombre de usuario:</label>
                <input type="text" id="usuario" name="usuario" required placeholder="Ingresa tu usuario">
            </div>

            <div class="grupo-input">
                <label for="clave">Contraseña:</label>
                <input type="password" id="clave" name="clave" required placeholder="Ingresa tu contraseña">
            </div>

            <button type="submit" class="btn-ingresar">Ingresar</button>
        </form>
    </main>
</body>
</html>
